 if(!title||!/[^\W_]|\p{Script=Han}/u.test(title)||title.length>160)return {text:'请补充要做的具体事项（160 字以内）。没有创建待办。'};

 return [...groups.entries()].map(([product,entries])=>`<section class="req-product-group"><div class="row"><h3>${esc(product)}</h3><span class="badge">${entries.length} 条</span></div>${entries.map(r=>`<details class="req-record"><summary><span class="req-record-title"><small>${esc(r.id)}</small><strong>${esc(r.title)}</strong></span><span class="req-record-meta"><span class="badge">${esc(r.category)}</span><span class="badge">${esc(r.priority)}</span><span class="badge warn">待评审</span></span></summary><dl>${reqFields.slice(1).map(([key,label])=>`<dt>${label}</dt><dd>${esc(r[key]||'待补充')}</dd>`).join('')}</dl>${reqSourceMarkup(r.sources)}</details>`).join('')}</section>`).join('');
}

function splitRequirement(i){
 const r=reqDraft.items[i];if(!r||reqDraft.items.length>=180)return;
 const parts=splitReqClauses(r.description);const note=parts.length>1?parts.slice(1).join('；'):'';
 reqDraft.items.splice(i+1,0,{...r,title:'',description:note,acceptance:''});
 if(note)r.description=parts[0];render();toast('已添加子条目，请分别填写需求名称和验收标准');
}

async function addRequirementFiles(files){
 if(reqDraft.busy)return;
 const list=Array.from(files),token=++reqDraft.token;reqDraft.busy=true;reqDraft.notice='正在读取材料…';render();const warnings=[];
 for(const file of list){
  if(reqDraft.files.length>=12){warnings.push('每批最多导入 12 份文件');break;}
  try{if(file.size>5*1024*1024)throw new Error('文件超过 5 MB');const data=await readRequirementFile(file);if(!data.length)throw new Error('没有可读取的文本');if(reqDraft.token!==token)return;reqDraft.files.push({name:file.name,data});}
  catch(e){warnings.push(`${file.name}：${e.message||'读取失败'}`);}
 }
 if(reqDraft.token!==token)return;reqDraft.busy=false;reqDraft.notice=warnings.length?warnings.join('；'):`已读取 ${reqDraft.files.length} 份文件，可生成结构化草稿。`;
 if(state.page==='chat'&&activeTopic().id==='need'&&state.requirementView==='work')render();
}

 if(!reqDraft.chat.some(c=>c.index===index))reqDraft.chat.push({index,text:m.text,by:m.by||'成员'});
 reqDraft.notice='已把对话加入待整理材料，确认前不会入库。';showRequirementView('work');
}
function previewRequirements(){
 if(reqDraft.busy)return;
 const typed=parseRequirementText(reqDraft.text,`${reqDraft.type} · 粘贴内容`);
 const chat=reqDraft.chat.flatMap(c=>parseRequirementText(c.text,`研发协作聊天 · ${c.by} · 消息 #${c.index+1}`));
 const rows=[...reqDraft.files.flatMap(f=>f.data),...typed,...chat];
 if(rows.length>180){toast(`解析出 ${rows.length} 条，请分批整理（每批最多 180 条）`);return;}
 const items=[];for(const row of rows){items.push(...decomposeRequirement(row).filter(reqValid));if(items.length>180){toast('拆分后的需求超过 180 条，请分批整理');return;}}
 if(!items.length){toast('请先导入或粘贴至少一条可整理的需求');return;}
 reqDraft.items=items;reqDraft.notice=`已生成 ${items.length} 条草稿。请复核是否需要拆分、补充或移除。`;render();
 document.getElementById('reqPreview')?.scrollIntoView?.({block:'start'});
}
function commitRequirements(){
 const inputProduct=reqDraft.product.trim();
 if(!reqNorm(inputProduct)){toast('请先填写归属产品');return;}
 if(!reqDraft.items.length||reqDraft.items.some(r=>!reqValid(r))){toast('请为每条需求填写名称，或移除空条目');return;}
 const product=state.requirements.find(r=>reqNorm(r.product)===reqNorm(inputProduct))?.product||inputProduct;
 let added=0,merged=0,unchanged=0;
 const index=new Map(state.requirements.map(r=>[requirementKey(r.product,r.title),r]));
 for(const draft of reqDraft.items){
  const title=draft.title.trim(),key=requirementKey(product,title),old=index.get(key);
  if(old){
   const before=old.sources.length;
   old.sources=uniqueRequirementSources([...old.sources,...draft.sources]);
   if(old.sources.length>before)merged++;else unchanged++;
   continue;
  }
  const entry={id:`REQ-${String(++state.requirementSequence).padStart(4,'0')}`,product,title,scenario:draft.scenario.trim(),description:draft.description.trim(),acceptance:draft.acceptance.trim(),category:reqCategoriesOrDefault(draft.category),priority:reqPick(draft.priority,reqPriorities),sources:uniqueRequirementSources(draft.sources),status:'待评审'};
  state.requirements.push(entry);index.set(key,entry);added++;
 }
 Object.assign(reqDraft,{text:'',files:[],items:[],notice:'',busy:false,token:reqDraft.token+1});
 reqFilter.product=product;reqFilter.query='';save();showRequirementView('library');
 toast(`新增 ${added} 条 · 补充 ${merged} 条来源${unchanged?` · 跳过 ${unchanged} 条重复`:''}`);
}
function uniqueRequirementSources(sources){return [...new Map(sources.map(s=>[JSON.stringify([s.label,s.quote]),s])).values()];}

function reqCategory(text){
 if(/认证|法规|合规|审计/.test(text))return '合规';
 if(/丢失|异常恢复|稳定|可靠|断线/.test(text))return '可靠性';
 if(/兼容|适配|协议|接口/.test(text))return '兼容性';
 if(/性能|帧率|延迟|时延|吞吐|低照度|弱光|功耗|响应时间/.test(text))return '性能';
 if(/易用|交互|体验|导航/.test(text))return '体验';
 if(/支持|查看|增加|提醒|通知|同步|导出|查询/.test(text))return '功能';
 return '其他';
}
const reqTitle=text=>String(text).trim().replace(/^[\s•*·\-—]+|^\d+[.、)）]\s*/g,'').replace(/^[“「]|[”。！？!?；;」]$/g,'').trim().slice(0,180);
function splitReqClauses(text){return String(text||'').split(/[；;\n]+/).map(s=>s.trim()).filter(Boolean);}
function decomposeRequirement(row){
 const parts=splitReqClauses(row.description||row.title),multi=parts.length>1;
 if(!parts.length)return [];
 return parts.map(part=>{
  const title=reqTitle(multi?(row.title&&row.title!==row.description?`${row.title}：${part}`:part):row.title||part);
  return {title,scenario:row.scenario||'',description:part,acceptance:multi?'':row.acceptance||'',category:reqCategories.includes(row.category)?row.category:reqCategory(`${title} ${part}`),priority:reqPick(row.priority,reqPriorities),sources:[row.source]};
 });
}
function reqHeader(value){const k=reqNorm(value);if(!k)return '';return Object.keys(reqHeaders).find(field=>reqHeaders[field].some(x=>reqNorm(x)===k))||'';}
function requirementTable(rows,label,locations=[]){
 const first=rows.findIndex(row=>row.some(cell=>String(cell??'').trim()));if(first<0)return [];
 const fields=Array.from(rows[first],reqHeader);
 const hasHeader=fields.includes('title')||fields.includes('description');
 return rows.slice(first+Number(hasHeader)).flatMap((row,j)=>{
  const i=first+Number(hasHeader)+j,quote=row.map(c=>String(c??'').trim()).filter(Boolean).join(' | ');
  if(!quote)return [];
  const item={source:{label:`${label} · ${locations[i]||`第 ${i+1} 行`}`,quote}};
  if(hasHeader)fields.forEach((field,col)=>{const value=String(row[col]??'').trim();if(field&&value)item[field]=item[field]?`${item[field]} / ${value}`:value;});
  if(!hasHeader){item.title=String(row.find(c=>String(c??'').trim())||'').trim();item.description=row.filter(c=>c!=null&&String(c).trim()).slice(1).join(' / ')||item.title;}
  return item.title||item.description?[item]:[];
 });
}
function reqDelimited(text,delimiter){
 const rows=[];let row=[],cell='',quoted=false;
 for(let i=0;i<text.length;i++){
  const c=text[i];
  if(c==='"'&&(quoted||cell==='')){if(quoted&&text[i+1]==='"'){cell+='"';i++;}else quoted=!quoted;}
  else if(!quoted&&c===delimiter){row.push(cell);cell='';}
  else if(!quoted&&(c==='\n'||c==='\r')){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell='';}
  else cell+=c;
 }
 if(row.length||cell)rows.push([...row,cell]);return rows;
}
function parseRequirementText(raw,label,force=''){
 const text=String(raw||'').replace(/^\uFEFF/,'').trim();if(!text)return [];
 const lines=text.split(/\r\n|\n|\r/),first=lines[0];
 if(force||first.includes('\t')||reqDelimited(first,',').filter(c=>reqHeader(c)).length>=2)return requirementTable(reqDelimited(text,force||(first.includes('\t')?'\t':',')),label);
 if(/^\|.+\|\s*$/.test(first)&&lines[1]?.includes('---'))return requirementTable(lines.filter(s=>/^\|.+\|\s*$/.test(s)&&!/^\|[\s|:\-]+\|\s*$/.test(s)).map(s=>s.trim().slice(1,-1).split('|')),label);
 const rows=[];let current=null;
 lines.forEach((line,i)=>{
  const original=line.trim();let content=original.replace(/^#{1,6}\s+|^(?:[-*•·]\s+|\d+[.、)）]\s*)/,'').trim();
  if(!content||/^(?:需求收集表|需求清单|聊天记录|产品需求|群聊记录)[：:]?$/.test(content))return;
  const speaker=content.match(/^(?:\[?\d{1,2}:\d{2}(?::\d{2})?\]?\s*)?([^：:]{1,24})[：:]\s*(.+)$/);
  const field=speaker&&reqHeader(speaker[1]);
  if(field&&current&&['scenario','description','acceptance','priority','category'].includes(field)){
   current[field]=speaker[2];current.source.quote+='\n'+original;return;
  }
  let scenario='';if(speaker){content=speaker[2];if(!field)scenario=speaker[1].trim();}
  if(/^(?:收到|好的|明白|谢谢|ok|嗯|是的|辛苦了)[。！!，,\s]*$/i.test(content))return;
  if(!reqTitle(content))return;
  current={title:'',description:content,scenario,source:{label:`${label} · 第 ${i+1} 行`,quote:original}};rows.push(current);
 });
 return rows;
}

async function readRequirementFile(file){
 const ext=file.name.split('.').at(-1).toLowerCase();
 if(['txt','md','csv','tsv'].includes(ext)){
  const bytes=new Uint8Array(await file.arrayBuffer());
  let text;
  if(bytes[0]===0xff&&bytes[1]===0xfe)text=new TextDecoder('utf-16le').decode(bytes);
  else if(bytes[0]===0xfe&&bytes[1]===0xff)text=new TextDecoder('utf-16be').decode(bytes);
  else{try{text=new TextDecoder('utf-8',{fatal:true}).decode(bytes);}catch(e){text=new TextDecoder('gb18030').decode(bytes);}}
  if(text.length>200000)throw new Error('文本过长，请拆分后再导入');
  return parseRequirementText(text,file.name,ext==='csv'?',':ext==='tsv'?'\t':'');
 }
 if(!['xlsx','docx'].includes(ext))throw new Error('不支持该格式，请另存为 .xlsx、.docx 或文本');
 const read=officeArchive(await file.arrayBuffer());
 return ext==='xlsx'?readRequirementSheet(read,file.name):readRequirementWord(read,file.name);
}
function officeArchive(buffer){
 const v=new DataView(buffer),n=v.byteLength,decoder=new TextDecoder();
 let end=n-22;while(end>=Math.max(0,n-65557)&&v.getUint32(end,true)!==0x06054b50)end--;
 if(end<0||end<Math.max(0,n-65557))throw new Error('Office 文件无法读取');
 const total=v.getUint16(end+10,true);let pos=v.getUint32(end+16,true),readBytes=0;const entries=new Map();
 if(total>1800)throw new Error('文件结构过大，请拆分');
 for(let j=0;j<total;j++){
  if(pos+46>n||v.getUint32(pos,true)!==0x02014b50)throw new Error('Office 文件结构不完整');
  const nameLength=v.getUint16(pos+28,true),extra=v.getUint16(pos+30,true),comment=v.getUint16(pos+32,true);
  const name=decoder.decode(new Uint8Array(buffer,pos+46,nameLength));
  entries.set(name,{method:v.getUint16(pos+10,true),flags:v.getUint16(pos+8,true),size:v.getUint32(pos+20,true),expanded:v.getUint32(pos+24,true),start:v.getUint32(pos+42,true)});
  pos+=46+nameLength+extra+comment;
 }
 return async name=>{
  const e=entries.get(name);if(!e)return null;
  if(e.flags&1||e.expanded>6*1024*1024||readBytes+e.expanded>18*1024*1024)throw new Error('文件已加密或内容过大');
  const p=e.start;if(p+30>n||v.getUint32(p,true)!==0x04034b50)throw new Error('Office 文件结构不完整');
  const offset=p+30+v.getUint16(p+26,true)+v.getUint16(p+28,true);if(offset+e.size>n)throw new Error('Office 文件结构不完整');
  const data=new Uint8Array(buffer,offset,e.size);readBytes+=e.expanded;
  if(e.method===0)return decoder.decode(data);
  if(e.method!==8||typeof DecompressionStream==='undefined')throw new Error('当前浏览器无法读取压缩 Office 文件，请使用新版浏览器或另存为文本');
  const reader=new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw')).getReader();
  const chunks=[];let length=0;
  try{while(true){const {value,done}=await reader.read();if(done)break;length+=value.byteLength;if(length>e.expanded){await reader.cancel();throw new Error('Office 文件内容长度无效');}chunks.push(decoder.decode(value,{stream:true}));}chunks.push(decoder.decode());return chunks.join('');}finally{reader.releaseLock();}
 };
}
const reqXml=raw=>{if(!raw||/<!DOCTYPE|<!ENTITY/.test(raw))throw new Error('找不到有效的文档内容');const doc=new DOMParser().parseFromString(raw,'application/xml');if(doc.getElementsByTagName('parsererror').length)throw new Error('文档格式有误');return doc;};
const reqTags=(node,name)=>Array.from(node.getElementsByTagNameNS('*',name));
const reqTagText=(node,name)=>reqTags(node,name).map(t=>t.textContent).join('');
const reqPath=(base,relative)=>new URL(relative,`https://office.invalid/${base}`).pathname.slice(1);
function reqSheetColumn(ref){let i=0;for(const c of (ref.match(/^[A-Z]+/i)?.[0]||'').toUpperCase())i=i*26+c.charCodeAt(0)-64;return i-1;}
async function readRequirementSheet(read,label){
 const workbook=reqXml(await read('xl/workbook.xml')),rels=reqXml(await read('xl/_rels/workbook.xml.rels'));
 const relMap=new Map(reqTags(rels,'Relationship').filter(r=>r.getAttribute('TargetMode')!=='External').map(r=>[r.getAttribute('Id'),r.getAttribute('Target')]));
 const strings=await read('xl/sharedStrings.xml'),values=strings?reqTags(reqXml(strings),'si').map(x=>reqTagText(x,'t')):[];
 const sheets=reqTags(workbook,'sheet');if(sheets.length>24)throw new Error('工作表过多，请拆分后再导入');
 const records=[];let seenRows=0;
 for(const sheet of sheets){
  const ref=Array.from(sheet.attributes).find(a=>a.localName==='id')?.value,target=relMap.get(ref);if(!target)continue;
  const sheetXml=reqXml(await read(reqPath('xl/workbook.xml',target))),sheetRows=reqTags(sheetXml,'row');
  seenRows+=sheetRows.length;if(seenRows>4000)throw new Error('工作表行数过多，请拆分后再导入');
  const rows=sheetRows.map(r=>{const cells=[];for(const c of reqTags(r,'c')){const idx=reqSheetColumn(c.getAttribute('r')||''),kind=c.getAttribute('t'),v=reqTagText(c,'v');if(idx>511)continue;cells[idx<0?cells.length:idx]=kind==='s'?(values[Number(v)]||''):kind==='inlineStr'?reqTagText(c,'t'):v;}return cells;});
  records.push(...requirementTable(rows,`${label} / ${sheet.getAttribute('name')||'工作表'}`,sheetRows.map((r,i)=>`第 ${r.getAttribute('r')||i+1} 行`)));
 }
 return records;
}
async function readRequirementWord(read,label){
 const doc=reqXml(await read('word/document.xml')),body=reqTags(doc,'body')[0];if(!body)return [];
 const output=[];for(const [i,node] of Array.from(body.children).entries()){
  if(node.localName==='p'){const text=reqTagText(node,'t');output.push(...parseRequirementText(text,`${label} · 段落 ${i+1}`).map(r=>({...r,source:{...r.source,label:`${label} · 段落 ${i+1}`}})));}
  if(node.localName==='tbl'){const rows=Array.from(node.children).filter(n=>n.localName==='tr').map(r=>Array.from(r.children).filter(n=>n.localName==='tc').map(c=>reqTagText(c,'t')));output.push(...requirementTable(rows,`${label} · 表格 ${i+1}`));}
 }
 return output;
}

function reviewAction(a){const release=a==='release',close=a==='close';modal(`<h2>${release?'发布准入缺口':close?'结项复盘草稿':a==='charter'?'Charter 评审草稿':'协作行动计划'}</h2><div class="note">${release?'禁止放行：DVT 报告、EMC 认证、PVT 量产签核缺失。':close?'目标达成、成本和质量数据待补充；遗留项接收人与验收证据未确认。':'草稿可修改，确认仅创建评审或协作记录，不修改项目基线。'}</div><label>方案 / 评审意见<textarea id="reviewText">${release?'请质量负责人补齐 DVT 报告、认证结论和量产签核，完成后再次检查。':close?'请项目经理补齐目标达成与成本分析，指定遗留问题接收人。':a==='charter'?'请产品负责人确认目标客户、首发范围和目标成本，组织立项评审。':'硬件负责人核实替代料兼容性；结构负责人复核散热影响；质量负责人确认验证范围。'}</textarea></label><p>审批责任：${a==='charter'?'产品负责人 / 项目发起人':'项目经理 / 专业负责人'}。原型中只保存本地决策记录。</p><div class="dialogactions"><button onclick="closeModal()">返回修改</button><button class="primary" onclick="confirmAction('${a}')">${release||close?'确认补齐计划':'确认并记录'}</button></div>`)}function confirmAction(a){const txt=document.getElementById('reviewText').value.trim();if(!txt){toast('请填写方案内容');return}state.logs.push((a==='charter'?'Charter 评审':a==='release'?'发布补齐':a==='close'?'结项补齐':'行动方案')+'已确认：'+txt);state.messages.push({who:'ai',text:'已保存你的确认意见：'+txt+'\n执行状态：待相关负责人接收（本地演示，未向外部派单）。',project:activeScope(),topic:activeTopic().id});save();closeModal();render();toast('已保存确认记录')}

function editAgent(i){const a=state.agents[i]||{name:'',desc:'',skill:''};modal(`<h2>${i<0?'创建':'配置'} Agent</h2><label>名称<input id="aName" value="${esc(a.name)}" placeholder="例如：供应链协同 Agent"></label><label>职责与工作指令<textarea id="aDesc">${esc(a.desc)}</textarea></label><label>绑定 Skill<input id="aSkill" value="${esc(a.skill)}" placeholder="用 · 分隔 Skill 名称"></label><label>执行策略<select id="aPolicy"><option>生成草稿，执行前确认</option><option>自动分析，仅关键动作确认</option></select></label><div class="note" style="margin-top:16px">可访问范围：当前授权项目。不可自行变更权限、对外发送消息或批准发布。此配置仅保存到当前浏览器。</div><div class="dialogactions"><button onclick="closeModal()">取消</button><button class="primary" onclick="saveAgent(${i})">保存配置</button></div>`);if(a.policy)document.getElementById('aPolicy').value=a.policy}

function editSkill(i){const s=state.skills[i]||{name:'',desc:'',version:'1.0',instructions:''};modal(`<h2>${i<0?'新建':'编辑'} Skill</h2><label>名称<input id="sName" value="${esc(s.name)}"></label><label>适用范围<input id="sDesc" value="${esc(s.desc)}"></label><label>版本<input id="sVersion" value="${esc(s.version)}"></label><label>输入 / 方法 / 输出 / 验收标准<textarea id="sInstructions" placeholder="输入：BOM 与物料库快照\n方法：核对料号、版本、交期\n输出：差异清单与证据\n验收：每条异常可追溯">${esc(s.instructions||'')}</textarea></label><div class="dialogactions"><button onclick="closeModal()">取消</button><button class="primary" onclick="saveSkill(${i})">保存版本</button></div>`)}function saveSkill(i){let s={name:document.getElementById('sName').value.trim(),desc:document.getElementById('sDesc').value.trim(),version:document.getElementById('sVersion').value.trim(),instructions:document.getElementById('sInstructions').value.trim(),on:i<0?true:state.skills[i].on};if(!s.name||!s.version){toast('请填写名称和版本');return}if(i<0)state.skills.push(s);else state.skills[i]=s;save();closeModal();render();toast('Skill 已保存到本地')}
function about(){return head('方案说明','以目标为入口，以证据为依据，以交付为结果。')+`<div class="grid"><section class="panel"><h2>01 · 让流程隐于协作</h2><p>对话识别用户目标，主 Agent 检索项目上下文、拆解计划、调用专业 Agent 和 Skill。过程产物自动归档，前台呈现“当前目标、下一步和需要你的决定”。</p><h2>02 · 人与 AI 的分工</h2><p>AI 负责信息聚合、草稿生成、依赖检查、预警和跟进。人负责范围、资源、成本、重大变更、质量放行与结项承诺。审核用对话卡片完成，后台保留状态与审计。</p><h2>03 · 制造业的一致性</h2><p>需求 → 产品规格 → 硬件 / 结构 / 固件设计 → BOM / 图纸基线 → EVT / DVT / PVT → 认证与量产，建立双向追溯。变更先评估跨专业、物料和模具影响，再更新基线。</p><h2>04 · 一个协作对象，一份可信上下文</h2><p>立项前关联到需求议题或 Charter 空间，立项后再继承到正式项目。需求、文档、任务、风险、版本、决策与证据始终可追溯。角色视图控制关注点；真实权限由服务端执行，Agent 继承用户授权，项目数据按边界隔离。</p></section><div><section class="panel"><h2>建议落地顺序</h2><div class="activity"><strong>MVP：看得清、跟得住</strong><p>个人工作台、研发协作 Bot 对话与直接派单、可选的企业群机器人配置、待办与预警、周报草稿。</p></div><div class="activity"><strong>第二阶段：执行可控</strong><p>审批卡片、任务写回、可恢复的工作流、幂等与重试、人工接管。</p></div><div class="activity"><strong>第三阶段：能力可运营</strong><p>Agent / Skill 版本、测试样例、发布与回滚、调用效果和成本分析。</p></div></section><section class="panel"><h2>原型边界</h2><p class="sub">当前为单文件 HTML，内置模拟项目与规则响应。支持五个模拟人员视图、研发 Bot 对话、产品需求整理与本地需求库、Bot 直接派单、模拟提单与审批、个人待办和可选的企业群机器人配置。本地模拟未连接真实企业聊天平台、模型或审批系统。</p><div class="chips"><button onclick="exportState()">导出演示配置</button><button onclick="resetAsk()">重置演示数据</button></div></section></div></div>`}
